# =============================================================================
# Aos Fatos — Cloud Run Service Manifest
# =============================================================================

apiVersion: serving.knative.dev/v1
kind: Service

metadata:
  name: aos-fatos-server
  labels:
    cloud.googleapis.com/location: ${GCP_REGION}
  annotations:
    run.googleapis.com/ingress: all

spec:
  template:
    metadata:
      annotations:
        # ── Auto-scaling ──────────────────────────────────────────────────────
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"

        # ── Secret Manager — lookup names → resource IDs ──────────────────────
        run.googleapis.com/secrets: "jwt-secret:projects/${GCP_PROJECT_NUMBER}/secrets/JWT_SECRET,aosfatos-api-key:projects/${GCP_PROJECT_NUMBER}/secrets/AOSFATOS_API_KEY"
    spec:
      # ← Dedicated least-privilege runtime service account
      serviceAccountName: jor-mcp-runner@${GCP_PROJECT_ID}.iam.gserviceaccount.com

      containers:
        - image: ${IMAGE_URL}

          ports:
            - name: http1
              containerPort: 8080

          resources:
            limits:
              cpu: "1"
              memory: 1Gi

          env:
            # ── Plain-text variables ─────────────────────────────────────────────
            - name: LOG_LEVEL
              value: "INFO"
            - name: GOOGLE_CLOUD_PROJECT
              value: "jor-mcp-59831"
            - name: FIREBASE_PROJECT_ID
              value: "${FIREBASE_PROJECT_ID}"
            - name: WORDPRESS_API_URL
              value: "${WORDPRESS_API_URL}"
            - name: AOSFATOS_API_URL
              value: "${AOSFATOS_API_URL}"
            - name: MCP_GITHUB_REPOS
              value: "${MCP_GITHUB_REPOS}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
            - name: FIREBASE_WEB_API_KEY
              value: "${FIREBASE_WEB_API_KEY}"
            - name: OAUTH_SERVER_BASE_URL
              value: "https://aos-fatos-server-607018375547.us-central1.run.app"
            - name: OAUTH_PORTAL_BASE_URL
              value: "https://mcp-oauth.aosfatos.org"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://mcp-oauth.aosfatos.org"
            - name: OAUTH_ALLOWED_REDIRECT_HOSTS
              value: "claude.ai,chatgpt.com,www.braintrust.dev"

            # ── Secrets via Secret Manager ───────────────────────────────────
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: AOSFATOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aosfatos-api-key
                  key: latest

  traffic:
    - percent: 100
      latestRevision: true